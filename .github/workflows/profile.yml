# Keeps the profile README's live sections fresh, once a day and on demand (Actions tab > Run workflow).
#   langs: recounts languages and commit times across all repos, private included. Needs the LANGS_TOKEN secret:
#          a fine-grained token with access to All repositories, Metadata + Contents: read (nothing else).
#   snake: draws the contribution graph as a snake on the `output` branch, which the README shows.
name: profile

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  langs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          [ -n "$GH_TOKEN" ] || { echo "::notice::LANGS_TOKEN secret not set, stats left as they are"; exit 0; }
          python3 scripts/stats.py
        env:
          GH_TOKEN: ${{ secrets.LANGS_TOKEN }}
      - name: Commit if changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update stats"
          git push

  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
